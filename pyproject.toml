# Energy-stack project configuration.
# This file is the canonical location for tool config (mypy, import-linter)
# per the type-checker rollout spec (docs/superpowers/specs/2026-05-20-type-checker-design.md).
# The repo is NOT a single Python package; each service under
# deploy/energy-stack/ is its own deployment unit.

[tool.mypy]
# Match service Dockerfiles (FROM python:3.13-slim).
python_version = "3.13"
strict = true
# mypy 2 default flips — explicit per spec §8.2 R7A so intent is
# documented and not subject to default-drift between minor versions.
local_partial_types = true
strict_bytes = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# Make each renamed service under deploy/energy-stack/ a top-level
# package on the mypy search path (e.g., hvac_scheduler.app).
mypy_path = "deploy/energy-stack"

# Third-party library overrides. Libraries without py.typed get
# `ignore_missing_imports = true` so mypy treats them as Any. Per-library
# typed adapters (see import-linter contracts and spec §5.2-5.5) are
# the path to recovering type safety on bug-prone surfaces.
# influxdb_client.* — VERIFIED ships py.typed; no override needed.
# Upstream stubs are authoritative. See docs/type-debt-backlog.md.

[[tool.mypy.overrides]]
# PyYAML ships without py.typed; types-PyYAML is the stub package.
# Suppressed here because types-PyYAML is not yet in requirements-dev.lock.
# Add types-PyYAML to requirements-dev.in + re-lock to recover type safety.
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# aiosomecomfort (the maintained Total Connect Comfort scrape client, the
# dep HA's honeywell integration ships) is untyped — no py.typed, no stubs.
# tcc_client.py is the single typed adapter boundary that wraps it (see the
# import-linter forbidden contract below), mirroring the influxdb_client /
# influx_adapter pattern.
module = "aiosomecomfort.*"
ignore_missing_imports = true

# Test-file relaxation. Mypy override `module` patterns must be
# fully-qualified dotted module names (NOT filename globs). The list
# below is populated per-service as migrations land. Each service PR
# appends its own test module names.
#
# What stays strict in tests:
#   - disallow_any_generics
#   - no_implicit_optional
#   - warn_redundant_casts
#   - warn_return_any
#   - strict_equality
# What's relaxed:
#   - disallow_untyped_defs (test functions return -> None implicitly)
#   - disallow_untyped_decorators (mock/parametrize decorators have
#     less-than-perfect types)
[[tool.mypy.overrides]]
module = [
    "hvac_scheduler.test_hvac_scheduler",
    "hvac_scheduler.test_decision_trace",
    "hvac_scheduler.test_freshness",
    "hvac_scheduler.test_price_overlay",
    "hvac_scheduler.test_integration_2025_replay",
    "hvac_scheduler.test_influx_adapter",
    "hvac_scheduler.conftest",
    # Cockpit-backend test modules (added in PR 4; `backend` is the
    # top-level package rooted at deploy/energy-stack/cockpit/)
    "backend.tests.test_snapshot",
    "backend.tests.test_live_assembler",
    # comed-poller test modules (added in PR 5)
    "comed_poller.test_comed_poller",
    # pjm-dm2-poller test modules (added in PR 6)
    "pjm_dm2_poller.test_pjm_dm2_poller",
    # hvac-scheduler-watchdog test modules (added in PR 7)
    "hvac_scheduler_watchdog.test_hvac_scheduler_watchdog",
    # nws-poller test modules (added in PR 8)
    "nws_poller.test_nws_poller",
    # eagle-poller test modules (added in PR 9)
    "eagle_poller.test_eagle_poller",
    # refoss-poller test modules (added in PR 10)
    "refoss_poller.test_refoss_poller",
    # thermostat-poller test modules (added in PR 11)
    "thermostat_poller.test_thermostat_poller",
    # haven-ingest test modules (added in PR 12)
    "haven_ingest.test_haven_ingest",
    # ecowitt-ingest test modules (added in PR 13)
    "ecowitt_ingest.test_ecowitt_ingest",
    # telegram-notifier test modules (added in PR 14)
    "telegram_notifier.test_telegram_notifier",
    # commissioning-controller test modules (added in A1)
    "hvac_scheduler.test_controller_config",
    "hvac_scheduler.test_controller_core",
    # TCC adapter test modules (Control4 -> TCC swap)
    "hvac_scheduler.test_tcc_client",
    "thermostat_poller.test_tcc_client",
]
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# rev 4 spike-only controller test modules (plan 2026-07-05). The plan's
# embedded test code is binding and transcribed verbatim, and it uses
# untyped fakes (bare generics, unannotated returns, untyped helper calls,
# assert-narrowing the fake's mutable state), so these modules need a
# wider relaxation than the shared test list above. New test_rev4_*
# modules are appended HERE, not to the list above.
module = [
    "hvac_scheduler.test_rev4_acceptance",
    "hvac_scheduler.test_rev4_config",
    "hvac_scheduler.test_rev4_pricing",
    "hvac_scheduler.test_rev4_loop",
    "hvac_scheduler.test_rev4_tiers",
    "hvac_scheduler.test_rev4_holds",
]
disallow_untyped_defs = false
disallow_untyped_decorators = false
disallow_incomplete_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
warn_unreachable = false

[[tool.mypy.overrides]]
# TEMPORARY SCAFFOLDING (rev 4 plan 2026-07-05): the acceptance test
# imports hvac_scheduler.controller.{config,loop,device} before those
# modules exist (config/loop land in PR-1 Tasks 2/4; device in PR-3
# Task 9). ignore_missing_imports only applies while a module cannot be
# found — once each module lands it is strictly checked as usual, so
# this block self-retires. Remove it at Task 11 (acceptance goes green).
module = "hvac_scheduler.controller.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Adapter-boundary enforcement (spec §5.5). Each typed adapter ships a
# corresponding `forbidden` contract banning direct use of the wrapped
# library outside the adapter module.
[tool.importlinter]
root_packages = ["hvac_scheduler"]
# Required for `forbidden` contracts targeting third-party modules.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only influx_adapter may import influxdb_client"
type = "forbidden"
source_modules = ["hvac_scheduler"]
forbidden_modules = ["influxdb_client"]
ignore_imports = [
    # The adapter itself owns the read + write surfaces and is the
    # only legitimate site for these imports per spec §5.5.
    "hvac_scheduler.influx_adapter -> influxdb_client",
    # app.py.main() still constructs InfluxDBClient + uses SYNCHRONOUS
    # for write_api configuration. import-linter / grimp consolidates
    # all imports from a module to influxdb_client.* into a single
    # edge, so the single ignore below covers both `from
    # influxdb_client import InfluxDBClient` and
    # `from influxdb_client.client.write_api import SYNCHRONOUS`.
    # A future PR could move client + write_api construction into
    # the adapter too, eliminating this exemption; PR 3b leaves it
    # as a bounded exception.
    "hvac_scheduler.app -> influxdb_client",
]

[[tool.importlinter.contracts]]
name = "Only tcc_client may import aiosomecomfort"
type = "forbidden"
source_modules = ["hvac_scheduler"]
forbidden_modules = ["aiosomecomfort"]
ignore_imports = [
    # tcc_client.py is the single typed adapter boundary wrapping the
    # untyped aiosomecomfort library (mirrors influx_adapter). app.py
    # imports TCCClient from tcc_client, never aiosomecomfort directly.
    "hvac_scheduler.tcc_client -> aiosomecomfort",
    # The adapter's own unit test imports the SessionTimedOut exception
    # class to drive the reauth path — a test-only boundary exception.
    "hvac_scheduler.test_tcc_client -> aiosomecomfort",
]
