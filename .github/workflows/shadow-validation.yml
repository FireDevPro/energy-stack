name: Shadow validation

# Pre-experiment shadow validation per spec §11 #13 — Phase 6.
#
# Runs tools/analysis/run_shadow_validation.py on the self-hosted pi-lab
# runner against the pi-lab localhost InfluxDB. Outputs validation JSON
# and findings draft as a GitHub Actions artifact.
#
# Manual-dispatch only (workflow_dispatch). The pre-OSF design intent is
# to run this on demand from the Actions UI, not as a deploy side-effect.
#
# Influx credentials are read from the pi-lab-resident ~/energy-stack/.env
# file (already chmod 600, already populated by deploy.yml convention).
# No new GitHub secrets are required.

on:
  workflow_dispatch:
    inputs:
      window_start:
        description: 'Window start (ISO UTC). Spec-locked default.'
        required: false
        default: '2026-04-29T00:00:00Z'
      window_end:
        description: 'Window end (ISO UTC). Blank = now.'
        required: false
        default: ''

jobs:
  shadow-validate:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6  # Node 24, matches deploy.yml

      - name: Inspect Python availability
        shell: bash
        run: |
          set -e
          python3 --version
          which python3

      - name: Ensure venv with analysis requirements
        shell: bash
        run: |
          set -e
          VENV="$HOME/.venv-shadow"
          if [ ! -d "$VENV" ]; then
            # python3-venv may not be present on pi-lab; fail loudly if so
            python3 -m venv "$VENV" \
              || { echo "::error::python3 -m venv failed — install python3-venv on pi-lab"; exit 1; }
          fi
          # shellcheck disable=SC1091
          source "$VENV/bin/activate"
          pip install --quiet --upgrade pip
          # --require-hashes: requirements.txt is pip-compile'd with hashes;
          # enforces the locked OSF-tracked environment per requirements.in.
          pip install --quiet --require-hashes -r tools/analysis/requirements.txt

      - name: Extract Influx credentials from pi-lab .env
        shell: bash
        run: |
          set -e
          ENV_FILE="$HOME/energy-stack/.env"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::missing $ENV_FILE — deploy.yml must have run at least once on this host"
            exit 1
          fi
          # Pi-lab .env naming convention (verified 2026-05-18):
          #   INFLUXDB_INIT_ADMIN_TOKEN  literal admin token
          #   INFLUXDB_INIT_ORG          literal org name
          #   INFLUXDB_INIT_BUCKET       literal bucket name
          # docker compose maps these to INFLUXDB_TOKEN/ORG/BUCKET when
          # starting service containers; we do the same name remap here
          # so the runner sees INFLUXDB_* (its consumed convention).
          # We do NOT use the INFLUX_TOKEN/ORG/BUCKET aliases in .env
          # because those reference $INFLUXDB_INIT_* via shell
          # interpolation and would be returned literally by grep+cut.
          # Disable `set -e` around the grep so a missing key prints a
          # useful error before the script exits.
          extract() {
            local key="$1"
            local val
            val=$(grep "^${key}=" "$ENV_FILE" | head -1 | cut -d= -f2-)
            if [ -z "$val" ]; then
              echo "::error::$key not present in $ENV_FILE"
              exit 1
            fi
            echo "$val"
          }
          set +e
          TOKEN=$(extract INFLUXDB_INIT_ADMIN_TOKEN); rc=$?
          set -e
          [ $rc -eq 0 ] || exit $rc
          set +e
          ORG=$(extract INFLUXDB_INIT_ORG); rc=$?
          set -e
          [ $rc -eq 0 ] || exit $rc
          set +e
          BUCKET=$(extract INFLUXDB_INIT_BUCKET); rc=$?
          set -e
          [ $rc -eq 0 ] || exit $rc
          # Mask the token in workflow logs.
          echo "::add-mask::$TOKEN"
          echo "INFLUXDB_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "INFLUXDB_ORG=$ORG" >> "$GITHUB_ENV"
          echo "INFLUXDB_BUCKET=$BUCKET" >> "$GITHUB_ENV"
          echo "Extracted INFLUXDB_* creds (token masked, org=$ORG, bucket=$BUCKET)."

      - name: Run shadow validation
        shell: bash
        env:
          INFLUXDB_URL: http://localhost:8086
        run: |
          set -e
          # shellcheck disable=SC1091
          source "$HOME/.venv-shadow/bin/activate"
          WINDOW_END_ARG=""
          if [ -n "${{ inputs.window_end }}" ]; then
            WINDOW_END_ARG="--window-end ${{ inputs.window_end }}"
          fi
          # PYTHONPATH=. so the runner can `from tools.analysis import ...`.
          # shellcheck disable=SC2086
          PYTHONPATH=. python tools/analysis/run_shadow_validation.py \
            --window-start "${{ inputs.window_start }}" \
            $WINDOW_END_ARG \
            --output-dir docs/replay-validation

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-validation-${{ github.run_id }}
          path: docs/replay-validation/*-shadow/
          if-no-files-found: error
          retention-days: 90

      - name: Summarize result
        if: always()
        shell: bash
        run: |
          # Dump the validation results JSON into the workflow summary so
          # the operator can see overall status without downloading the
          # artifact. JSON is small (<10KB) — fits the summary budget.
          for f in docs/replay-validation/*-shadow/validation_results.json; do
            if [ -f "$f" ]; then
              echo "## Shadow validation: $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
