name: Deploy to Pi

# Triggers a deployment when:
#   - Anything in deploy/ changes on main, OR
#   - The workflow file itself changes on main, OR
#   - Manually dispatched from the Actions UI
on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      stack:
        description: 'Force deploy a stack regardless of detected changes'
        required: false
        default: 'auto'
        type: choice
        options: [auto, energy-stack, n8n-stack, both]

# GitHub-hosted ubuntu-latest runners reach Pi-lab via Tailscale.
# Each job joins the tailnet as an ephemeral node tagged `tag:ci`,
# scoped by the tailnet ACL to SSH:22 on `tag:server` only (the Pi).
# When the job ends, the ephemeral node auto-deregisters from the tailnet.
#
# Auth: Tailscale SSH (tailscaled on the Pi mediates SSH on the tailscale
# interface — no OpenSSH keys in GHA secrets). The OAuth client_id +
# secret are the only credentials. Tailscale's SSH layer issues short-
# lived certs scoped to this run.
#
# Replaces the prior self-hosted runner (decommissioned ahead of public-
# repo flip). Same contract: same triggers, same exclude list, same
# smoke-test logic; just routed via Tailscale instead of running on Pi.

# Don't race two deploys against each other. If a second push lands
# while one is mid-flight, queue it rather than killing the in-flight one.
concurrency:
  group: deploy-pi
  cancel-in-progress: false

env:
  PI_HOST: pi-lab
  PI_USER: chris
  # SSH options: tailscale-issued certs change per-deploy so accept-new
  # is safe (no long-lived known_hosts to drift); BatchMode=yes prevents
  # interactive password prompts on auth failure (fail fast); ConnectTimeout
  # bounds a Pi outage so a stuck deploy doesn't hold the GHA runner.
  SSH_OPTS: '-o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30'

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      energy-stack: ${{ steps.changes.outputs.energy-stack }}
      n8n-stack: ${{ steps.changes.outputs.n8n-stack }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect changed stacks
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.stack || 'auto' }}" in
            energy-stack) echo "energy-stack=true" >> $GITHUB_OUTPUT; echo "n8n-stack=false" >> $GITHUB_OUTPUT ;;
            n8n-stack)    echo "energy-stack=false" >> $GITHUB_OUTPUT; echo "n8n-stack=true" >> $GITHUB_OUTPUT ;;
            both)         echo "energy-stack=true" >> $GITHUB_OUTPUT; echo "n8n-stack=true" >> $GITHUB_OUTPUT ;;
            *)
              # Auto-detect from the diff
              CHANGED=$(git diff --name-only HEAD^ HEAD || git ls-files)
              echo "Changed files:"
              echo "$CHANGED" | sed 's/^/  /'
              if echo "$CHANGED" | grep -q '^deploy/energy-stack/'; then
                echo "energy-stack=true" >> $GITHUB_OUTPUT
              else
                echo "energy-stack=false" >> $GITHUB_OUTPUT
              fi
              if echo "$CHANGED" | grep -q '^deploy/n8n-stack/'; then
                echo "n8n-stack=true" >> $GITHUB_OUTPUT
              else
                echo "n8n-stack=false" >> $GITHUB_OUTPUT
              fi
              ;;
          esac

  deploy-energy-stack:
    needs: detect
    if: needs.detect.outputs.energy-stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Join tailnet (ephemeral tag:ci)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Verify reachability
        shell: bash
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ env.PI_USER }}@${{ env.PI_HOST }} \
            "echo connected from $(hostname) at $(date -Iseconds); uname -a"

      - name: Sync to ~/energy-stack
        shell: bash
        run: |
          # Runtime paths excluded from --delete: .env (chmod 600 on Pi),
          # .env.* (backups). The `inbox/` exclude is vestigial from the
          # original haven-ingest CSV-watcher (replaced May 2026 with an
          # API poller); kept for now so any historical CSV files left on
          # the Pi don't get blown away by --delete.
          rsync -av --delete \
            -e "ssh ${{ env.SSH_OPTS }}" \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'inbox' \
            ./deploy/energy-stack/ \
            ${{ env.PI_USER }}@${{ env.PI_HOST }}:~/energy-stack/

      - name: Build and deploy
        shell: bash
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ env.PI_USER }}@${{ env.PI_HOST }} bash <<'EOF'
            set -euo pipefail
            cd ~/energy-stack
            docker compose pull --quiet
            # Build picks up Dockerfile changes; layer cache makes unchanged services fast
            docker compose build --quiet
            docker compose up -d --remove-orphans
            echo ""
            echo "=== Service status ==="
            docker compose ps
          EOF

      - name: Smoke test
        shell: bash
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ env.PI_USER }}@${{ env.PI_HOST }} bash <<'EOF'
            set -euo pipefail
            cd ~/energy-stack
            # Wait briefly for services to settle, then check none crashed
            sleep 10
            UNHEALTHY=$(docker compose ps --format json | grep -E '"State":"(exited|restarting|dead)"' || true)
            if [ -n "$UNHEALTHY" ]; then
              echo "::error::Some services not healthy after deploy:"
              echo "$UNHEALTHY"
              exit 1
            fi
            echo "All services healthy."
          EOF

  deploy-n8n-stack:
    needs: detect
    if: needs.detect.outputs.n8n-stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Join tailnet (ephemeral tag:ci)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Sync to ~/n8n
        shell: bash
        run: |
          rsync -av --delete \
            -e "ssh ${{ env.SSH_OPTS }}" \
            --exclude '.env' \
            --exclude '.env.*' \
            ./deploy/n8n-stack/ \
            ${{ env.PI_USER }}@${{ env.PI_HOST }}:~/n8n/

      - name: Deploy
        shell: bash
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ env.PI_USER }}@${{ env.PI_HOST }} bash <<'EOF'
            set -euo pipefail
            cd ~/n8n
            docker compose pull --quiet
            docker compose up -d --remove-orphans
            echo ""
            echo "=== Service status ==="
            docker compose ps
          EOF

      - name: Smoke test
        shell: bash
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ env.PI_USER }}@${{ env.PI_HOST }} bash <<'EOF'
            set -euo pipefail
            cd ~/n8n
            sleep 10
            UNHEALTHY=$(docker compose ps --format json | grep -E '"State":"(exited|restarting|dead)"' || true)
            if [ -n "$UNHEALTHY" ]; then
              echo "::error::n8n services not healthy after deploy:"
              echo "$UNHEALTHY"
              exit 1
            fi
            echo "All services healthy."
          EOF
