[pytest]
# Shared pytest config for all energy-stack services. Each service's tests
# live under its own directory as test_<service_name>.py — unique module
# basenames so pytest can collect every service's tests in one run from the
# stack root, e.g.:
#
#     cd deploy/energy-stack/
#     python -m pytest .
#
# Or from a single service directory for focused runs:
#
#     cd deploy/energy-stack/<service>/
#     python -m pytest .
#
# Test files were renamed from `tests.py` to `test_<service>.py` on
# 2026-05-07 to fix a pytest import-file-mismatch bug surfaced by the
# CodeX review: every service had a top-level module named `tests`,
# so collecting more than one at the same time blew up.
#
# pytest walks up from cwd to find the nearest pytest config; this file is
# the single source of truth so individual services don't drift.
#
# asyncio_mode=auto applies to services with async tests (hvac-scheduler,
# telegram-notifier — when async paths get tests). No-op for sync-only
# tests like nws-poller.
asyncio_mode = auto

# A note on the rename from `tests.py` to `test_<service>.py` (CodeX 2026-05-07):
#
# Service test files used to all be named `tests.py`. Two problems with that:
#   1. pytest's default `python_files = test_*.py *_test.py` glob did NOT
#      match `tests.py`, so the bare `pytest deploy/energy-stack` command
#      silently skipped every service's tests.
#   2. Listing multiple `tests.py` files together caused pytest's import-
#      file-mismatch error (every file resolves to top-level module `tests`).
#
# Renaming to `test_<service>.py` fixes problem 1 (default discovery now
# picks them up) and partially fixes problem 2 (test-module names are now
# unique). However, every service still has its own `app.py` (or
# `poller.py`) source file. With pytest's default `prepend` import mode,
# collecting MULTIPLE services in one pytest invocation still fails because
# the first `app.py` imported gets cached in sys.modules, and subsequent
# services' tests doing `from app import X` find the wrong `app`.
#
# Two ways to make `pytest deploy/energy-stack` collect all services in
# one run: (a) `--import-mode=importlib` plus per-service conftest.py
# managing sys.path, or (b) rename every service directory from
# `comed-poller` to `comed_poller` and add `__init__.py` so each service
# is a proper Python package, then `from comed_poller.app import X`. Both
# have non-trivial blast radius (Dockerfile COPY paths, compose `build:`
# context, deploy scripts). For now, run services individually:
#
#     cd deploy/energy-stack/<service>/ && python -m pytest .
#
# Or use the [run_tests.sh](run_tests.sh) wrapper to iterate them all.
