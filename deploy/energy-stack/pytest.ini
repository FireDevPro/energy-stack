[pytest]
# Shared pytest config for all energy-stack services.
#
# **Supported test commands:**
#
#     # Run everything (the canonical full-stack test command):
#     bash deploy/energy-stack/run_tests.sh
#
#     # Run a single service:
#     cd deploy/energy-stack/<service>/ && python -m pytest .
#
# **Do NOT use `python -m pytest deploy/energy-stack` from the root** —
# it currently fails collection (see "Why" below).
#
# pytest walks up from cwd to find the nearest pytest config; this file is
# the single source of truth so individual services don't drift.
#
# asyncio_mode=auto applies to services with async tests (hvac-scheduler,
# telegram-notifier). No-op for sync-only tests like nws-poller.
asyncio_mode = auto

# Why a wrapper instead of single-pass pytest collection
# ------------------------------------------------------
# Service test files were renamed from `tests.py` to `test_<service>.py`
# on 2026-05-07 (CodeX review). That fix solved two problems:
#   1. pytest's default `python_files = test_*.py *_test.py` glob didn't
#      match `tests.py`, so a bare `pytest deploy/energy-stack` silently
#      skipped every service's tests.
#   2. Listing multiple `tests.py` files together caused import-file-mismatch
#      because every file resolved to a top-level module named `tests`.
#
# After the rename, a third problem remains and isn't fixed by this config:
# every service still has its own `app.py` (or `poller.py`). With pytest's
# default `prepend` import mode, the first `app.py` gets cached in
# sys.modules, and subsequent services' tests doing `from app import X`
# find the wrong app and fail with `ImportError: cannot import name 'Y'
# from 'app'`. CodeX pass 2 (2026-05-07) flagged that the earlier comment
# block here implied this was already fixed; it's not.
#
# Real fixes (any one of):
#   (a) `--import-mode=importlib` + per-service conftest.py managing sys.path
#   (b) Rename `comed-poller` → `comed_poller` everywhere, add `__init__.py`,
#       and import as `from comed_poller.app import X`
#   (c) Stop using top-level `app.py` per service; namespace the source files
#
# All three have non-trivial blast radius (Dockerfile COPY paths, compose
# `build:` context, deploy scripts, pyControl4-style cross-service shims).
# Until one is adopted, [`run_tests.sh`](run_tests.sh) is the supported
# all-stack runner — it iterates services and runs each in its own pytest
# process, which sidesteps the cache collision cleanly.
