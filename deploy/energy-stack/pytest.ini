[pytest]
# Shared pytest config for all energy-stack services. Each service's tests.py
# (e.g. nws-poller/tests.py, hvac-scheduler/tests.py, telegram-notifier/tests.py)
# is run from the service directory:
#
#     cd deploy/energy-stack/<service>/
#     python -m pytest tests.py
#
# pytest walks up from cwd to find the nearest pytest config; this file is
# the single source of truth so individual services don't drift.
#
# asyncio_mode=auto applies to services with async tests (hvac-scheduler,
# telegram-notifier — when async paths get tests). No-op for sync-only
# tests like nws-poller.
asyncio_mode = auto
