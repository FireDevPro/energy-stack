# Mosquitto broker for the ComfortNet HVAC pipeline.
# Design: docs/COMFORTNET_PIPELINE.md
#
# TLS-only on 8883 (no plaintext 1883 listener). Authenticated clients per
# password_file; per-topic authorization per acl_file. Persistence enabled
# so QoS 1 deliveries survive broker restarts.

listener 8883
protocol mqtt

# TLS material generated once via mosquitto/scripts/gen-certs.sh and placed
# on Pi-lab at /opt/mosquitto-certs/. Mounted into the container at /mosquitto/certs.
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
tls_version tlsv1.2

# Authentication and authorization.
# password_file lives on a separate named volume shared with mosquitto-init,
# so the dynamic file isn't mixed with bind-mounted static config.
allow_anonymous false
password_file /mosquitto/passwords/passwords
acl_file /mosquitto/config/acls

# Persistent session state (subscriptions, queued QoS 1 messages for offline
# durable subscribers) survives broker restarts.
persistence true
persistence_location /mosquitto/data/

# Logging to stdout so `docker logs mosquitto` shows broker activity.
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
