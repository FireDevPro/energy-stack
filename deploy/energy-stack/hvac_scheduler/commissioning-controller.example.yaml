# Rev 4 spike-only controller config schema — every key below is REQUIRED
# (no code defaults; a missing key is a startup error naming the key).
# All temps in temp_scale, on the scale's grid (0.5 for C, 1.0 for F).
temp_scale: C            # or F — must match the TEMP_SCALE env var
price_tiers_cents: {elevated_at: 10, scarcity_at: 20, hysteresis_cents: 2}
elevated_offset: 1.5     # warm drift above the device's program cool at elevated
scarcity_absolute: 29.5  # absolute cool target at scarcity (hottest allowed)
heat_floor: 18.5         # heat setpoint pinned at/below this on every push
humidity_guard: {rh_max_pct: 61, rh_clear_pct: 58}   # thermostat-RH hysteresis gate
hold_ttl_minutes: 30     # timed-hold TTL; expiry floors to the quarter-hour slot
release_confirm_buckets: 2   # consecutive fresh cheap buckets required to release
stale_release_minutes: 30    # no fresh price while holding -> hard release
