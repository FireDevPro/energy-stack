server {
    listen 80 default_server;
    server_name _;

    # Static prototype files (HTML + JSX + CSS).
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the sidecar webdashboard-api container.
    location /api/ {
        proxy_pass http://webdashboard-api:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Short timeout — if the API is down we want the dashboard to fail
        # fast and show its "stale" state, not hang the browser.
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
