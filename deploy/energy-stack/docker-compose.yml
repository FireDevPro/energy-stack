name: energy-stack

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_INIT_RETENTION}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  influx-init:
    # One-shot post-bootstrap provisioning for the longterm bucket and the
    # 1-min downsample task. Idempotent; runs on every `compose up -d`.
    # Design: docs/INFLUXDB_RETENTION.md
    build: ./influx-init
    container_name: influx-init
    restart: "no"
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      influxdb:
        condition: service_healthy
      grafana-image-renderer:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Server-side panel/dashboard PNG rendering via the grafana-image-renderer sidecar.
      GF_RENDERING_SERVER_URL: http://grafana-image-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboards live in the dedicated FireDevPro/grafana-dashboards repo,
      # cloned to /opt/grafana-dashboards on Pi-lab (see that repo's README).
      - /opt/grafana-dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": \"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  grafana-image-renderer:
    image: grafana/grafana-image-renderer:v5.8.8
    container_name: grafana-image-renderer
    restart: unless-stopped
    environment:
      RENDERING_MODE: default
    # Internal only — reachable by Grafana at grafana-image-renderer:8081, not published to the LAN.
    expose:
      - "8081"

  cockpit:
    # The Vigil — read-only rev-4.1 wall board. FastAPI serves three live
    # /api/vigil/* polls from InfluxDB plus the single-file frontend
    # same-origin on :8765 (cockpit/start-cockpit.ps1 remains the dev loop).
    build: ./cockpit
    container_name: cockpit
    restart: unless-stopped
    ports:
      - "8765:8765"
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}
    volumes:
      # Read-only, single source of truth for tier thresholds: the SAME
      # commissioning-controller.yaml the controller reads. Edit once, both see it.
      - ./hvac_scheduler/commissioning-controller.yaml:/config/commissioning-controller.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  eagle-poller:
    build: ./eagle_poller
    container_name: eagle-poller
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      EAGLE_IP: ${EAGLE_IP}
      EAGLE_CLOUD_ID: ${EAGLE_CLOUD_ID}
      EAGLE_INSTALL_CODE: ${EAGLE_INSTALL_CODE}
      EAGLE_METER_HW_ADDRESS: ${EAGLE_METER_HW_ADDRESS}
      EAGLE_POLL_INTERVAL: ${EAGLE_POLL_INTERVAL:-30}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}

  comed-poller:
    build: ./comed_poller
    container_name: comed-poller
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      COMED_POLL_INTERVAL: ${COMED_POLL_INTERVAL:-60}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}

  refoss-poller:
    build: ./refoss_poller
    container_name: refoss-poller
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      REFOSS_IP: ${REFOSS_IP}
      REFOSS_POLL_INTERVAL: ${REFOSS_POLL_INTERVAL:-30}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}

  nws-poller:
    build: ./nws_poller
    container_name: nws-poller
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      NWS_LAT: ${NWS_LAT:-41.6151}
      NWS_LON: ${NWS_LON:--88.2018}
      NWS_USER_AGENT: ${NWS_USER_AGENT:-energy-stack/1.0 (contact@local)}
      NWS_POLL_INTERVAL: ${NWS_POLL_INTERVAL:-1800}
      # Day bucketing and "now" anchored to the user's wall-clock tz, not the
      # container's UTC default. Without this, day labels can be off by one
      # at decision time (21:00 local) — choosing tomorrow's day-type from
      # the wrong forecast.
      SCHEDULER_TZ: ${SCHEDULER_TZ:-America/Chicago}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}

  purpleair-poller:
    build: ./purpleair_poller
    container_name: purpleair-poller
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      PURPLEAIR_API_KEY: ${PURPLEAIR_API_KEY}
      PURPLEAIR_SENSOR_ID: ${PURPLEAIR_SENSOR_ID:-290986}
      PURPLEAIR_POLL_INTERVAL: ${PURPLEAIR_POLL_INTERVAL:-900}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}

  airnow-poller:
    build: ./airnow_poller
    container_name: airnow-poller
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      AIRNOW_API_KEY: ${AIRNOW_API_KEY}
      AIRNOW_LAT: ${AIRNOW_LAT:-41.653976}
      AIRNOW_LON: ${AIRNOW_LON:--88.211868}
      AIRNOW_DISTANCE_MI: ${AIRNOW_DISTANCE_MI:-50}
      AIRNOW_POLL_INTERVAL: ${AIRNOW_POLL_INTERVAL:-1800}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}

  pjm-dm2-poller:
    build: ./pjm_dm2_poller
    container_name: pjm-dm2-poller
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      PJM_DM2_API_KEY: ${PJM_DM2_API_KEY}
      # 5-minute wake (post-PR-#48 inst_load addition). Each fetcher fires
      # only on its scheduled (hour, minute); hourly feeds still fire only
      # at :00 because their Schedule.minutes defaults to (0,). inst_load
      # has minutes=(0,5,10,...,55) so it fires every 5 min.
      # See deploy/energy-stack/pjm_dm2_poller/app.py FEED_SCHEDULE.
      PJM_DM2_POLL_INTERVAL: ${PJM_DM2_POLL_INTERVAL:-300}
      PJM_DM2_TZ: ${SCHEDULER_TZ:-America/Chicago}
      INFLUX_URL: http://influxdb:8086
      INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET}

  hvac-scheduler:
    build: ./hvac_scheduler
    container_name: hvac-scheduler
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      TCC_USERNAME: ${TCC_USERNAME}
      TCC_PASSWORD: ${TCC_PASSWORD}
      TCC_DEVICE_ID: ${TCC_DEVICE_ID:-4750378}
      # SCHEDULER_MODE is the sole write gate (rev 4): `shadow` computes +
      # traces with zero device writes; `production` writes live. Invalid
      # value -> exit 2; default `shadow` keeps behavior safe-by-default
      # if the .env on a host hasn't been migrated yet.
      SCHEDULER_MODE: ${SCHEDULER_MODE:-shadow}
      SCHEDULER_TZ: ${SCHEDULER_TZ:-America/Chicago}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}
      # Rev 4 spike-only controller: the mounted YAML (below) is the
      # experimental surface. TEMP_SCALE must match the YAML's temp_scale or
      # the loader fail-fasts (coherence check) — config is °C, so default °C.
      CONTROLLER_CONFIG_FILE: /config/commissioning-controller.yaml
      TEMP_SCALE: ${TEMP_SCALE:-C}
    volumes:
      - hvac_scheduler_data:/data
      - ./hvac_scheduler/commissioning-controller.yaml:/config/commissioning-controller.yaml:ro

  hvac-scheduler-watchdog:
    build: ./hvac_scheduler_watchdog
    container_name: hvac-scheduler-watchdog
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      WATCHDOG_INTERVAL_SECONDS: ${WATCHDOG_INTERVAL_SECONDS:-60}
      WATCHDOG_THRESHOLD_MINUTES: ${WATCHDOG_THRESHOLD_MINUTES:-10}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}

  thermostat-poller:
    build: ./thermostat_poller
    container_name: thermostat-poller
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      TCC_USERNAME: ${TCC_USERNAME}
      TCC_PASSWORD: ${TCC_PASSWORD}
      TCC_DEVICE_ID: ${TCC_DEVICE_ID:-4750378}
      THERMOSTAT_POLL_INTERVAL: ${THERMOSTAT_POLL_INTERVAL:-600}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}
    volumes:
      - thermostat_poller_data:/data

  ecowitt-ingest:
    build: ./ecowitt_ingest
    container_name: ecowitt-ingest
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      # Gateway pushes to http://<pi-lab-LAN-IP>:8088/data/report/.
      # Bound on the host so the GW1200 on the LAN can reach it.
      - "${ECOWITT_LISTEN_PORT:-8088}:8088"
    environment:
      ECOWITT_LISTEN_PORT: 8088
      ECOWITT_SHADED_CHANNEL: ${ECOWITT_SHADED_CHANNEL:-}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}

  haven-ingest:
    build: ./haven_ingest
    container_name: haven-ingest
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      HAVEN_AUTH0_DOMAIN: ${HAVEN_AUTH0_DOMAIN:-haven-production.auth0.com}
      HAVEN_CLIENT_ID: ${HAVEN_CLIENT_ID}
      HAVEN_REFRESH_TOKEN: ${HAVEN_REFRESH_TOKEN}
      HAVEN_DEVICE_ID: ${HAVEN_DEVICE_ID:-3645}
      HAVEN_OUTDOOR_ID: ${HAVEN_OUTDOOR_ID:-60585}
      HAVEN_POLL_INTERVAL: ${HAVEN_POLL_INTERVAL:-300}
      HAVEN_BACKFILL_DAYS: ${HAVEN_BACKFILL_DAYS:-7}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}
    volumes:
      - haven_ingest_data:/data

  telegram-notifier:
    build: ./telegram_notifier
    container_name: telegram-notifier
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      SUMMARY_HOUR: ${TELEGRAM_SUMMARY_HOUR:-8}
      ALERT_CHECK_INTERVAL_S: ${TELEGRAM_ALERT_INTERVAL_S:-300}
      POLLER_SILENT_MIN: ${TELEGRAM_POLLER_SILENT_MIN:-10}
      PRICE_SPIKE_THRESHOLD_C: ${TELEGRAM_PRICE_SPIKE_C:-20}
      ALERT_DEDUPE_MIN: ${TELEGRAM_ALERT_DEDUPE_MIN:-30}
      SCHEDULER_TZ: ${SCHEDULER_TZ:-America/Chicago}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}

  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q 'ready'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  promtail:
    image: grafana/promtail:3.3.2
    container_name: promtail
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/tmp
    command: -config.file=/etc/promtail/config.yml

  # ---- ComfortNet HVAC pipeline (profile: mqtt) ----
  # Live publisher: github.com/Promithius-DR/comfortnet · Historical design: docs/archive/COMFORTNET_PIPELINE.md
  #
  # Profile-gated so the standard `compose up -d` ignores them. The TLS
  # material at /opt/mosquitto-certs/ on Pi-lab must exist before bringing
  # these up; see deploy/energy-stack/mosquitto/scripts/gen-certs.sh and
  # the README's "ComfortNet pipeline deployment" section.
  #
  # To enable: `docker compose --profile mqtt up -d`
  # or set COMPOSE_PROFILES=mqtt in the environment.

  mosquitto-init:
    # One-shot: regenerates the broker password file from env vars on every
    # `compose --profile mqtt up -d`. Idempotent. Mosquitto depends on this
    # service completing successfully before it starts.
    profiles: ["mqtt"]
    build: ./mosquitto-init
    container_name: mosquitto-init
    restart: "no"
    environment:
      MOSQUITTO_PUBLISHER_PASSWORD: ${MOSQUITTO_PUBLISHER_PASSWORD}
      MOSQUITTO_TELEGRAF_PASSWORD: ${MOSQUITTO_TELEGRAF_PASSWORD}
      MOSQUITTO_N8N_PASSWORD: ${MOSQUITTO_N8N_PASSWORD}
    volumes:
      - mosquitto_passwords:/mosquitto/passwords

  mosquitto:
    profiles: ["mqtt"]
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acls:/mosquitto/config/acls:ro
      - mosquitto_passwords:/mosquitto/passwords:ro
      - mosquitto_data:/mosquitto/data
      - /opt/mosquitto-certs:/mosquitto/certs:ro
    healthcheck:
      # mosquitto_sub -E: connect, subscribe, exit on SUBACK — validates TLS,
      # auth, and ACL grant in one round-trip without waiting for a message.
      # Hostname `mosquitto` matches the cert's DNS:mosquitto SAN (verified
      # via SSL_set_tlsext_host_name in mosquitto's net_mosq.c). $SYS topics
      # are deny-by-default under acl_file, so we use an authorized topic
      # from telegraf's ACL grant.
      test: ["CMD-SHELL", "mosquitto_sub -E -h mosquitto -p 8883 --cafile /mosquitto/certs/ca.crt -u telegraf -P $${MOSQUITTO_TELEGRAF_PASSWORD} -t 'home/utility-room/hvac/comfortnet/+' -W 5 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      MOSQUITTO_TELEGRAF_PASSWORD: ${MOSQUITTO_TELEGRAF_PASSWORD}

  telegraf:
    profiles: ["mqtt"]
    image: telegraf:1.32-alpine
    container_name: telegraf
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /opt/mosquitto-certs:/etc/telegraf/certs:ro
    environment:
      MOSQUITTO_TELEGRAF_PASSWORD: ${MOSQUITTO_TELEGRAF_PASSWORD}
      INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG}

volumes:
  influxdb_data:
  influxdb_config:
  grafana_data:
  hvac_scheduler_data:
  thermostat_poller_data:
  haven_ingest_data:
  loki_data:
  promtail_positions:
  mosquitto_passwords:
  mosquitto_data:
