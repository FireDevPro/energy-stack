name: energy-stack

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_INIT_RETENTION}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": \"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  eagle-poller:
    build: ./eagle-poller
    container_name: eagle-poller
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      EAGLE_IP: ${EAGLE_IP}
      EAGLE_CLOUD_ID: ${EAGLE_CLOUD_ID}
      EAGLE_INSTALL_CODE: ${EAGLE_INSTALL_CODE}
      EAGLE_METER_HW_ADDRESS: ${EAGLE_METER_HW_ADDRESS}
      EAGLE_POLL_INTERVAL: ${EAGLE_POLL_INTERVAL:-30}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}

  comed-poller:
    build: ./comed-poller
    container_name: comed-poller
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      COMED_POLL_INTERVAL: ${COMED_POLL_INTERVAL:-60}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}

  refoss-poller:
    build: ./refoss-poller
    container_name: refoss-poller
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      REFOSS_IP: ${REFOSS_IP}
      REFOSS_POLL_INTERVAL: ${REFOSS_POLL_INTERVAL:-30}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}

  nws-poller:
    build: ./nws-poller
    container_name: nws-poller
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      NWS_LAT: ${NWS_LAT:-41.6151}
      NWS_LON: ${NWS_LON:--88.2018}
      NWS_USER_AGENT: ${NWS_USER_AGENT:-energy-stack/1.0 (contact@local)}
      NWS_POLL_INTERVAL: ${NWS_POLL_INTERVAL:-1800}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}

  hvac-scheduler:
    build: ./hvac-scheduler
    container_name: hvac-scheduler
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      CONTROL4_EMAIL: ${CONTROL4_EMAIL}
      CONTROL4_PASSWORD: ${CONTROL4_PASSWORD}
      CONTROL4_CONTROLLER_IP: ${CONTROL4_CONTROLLER_IP:-192.168.1.30}
      CONTROL4_THERMOSTAT_ID: ${CONTROL4_THERMOSTAT_ID:-3231}
      SCHEDULER_DRY_RUN: ${SCHEDULER_DRY_RUN:-true}
      SCHEDULER_DECISION_HOUR: ${SCHEDULER_DECISION_HOUR:-21}
      SCHEDULER_TZ: ${SCHEDULER_TZ:-America/Chicago}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}
    volumes:
      - hvac_scheduler_data:/data

  telegram-notifier:
    build: ./telegram-notifier
    container_name: telegram-notifier
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      SUMMARY_HOUR: ${TELEGRAM_SUMMARY_HOUR:-8}
      ALERT_CHECK_INTERVAL_S: ${TELEGRAM_ALERT_INTERVAL_S:-300}
      POLLER_SILENT_MIN: ${TELEGRAM_POLLER_SILENT_MIN:-10}
      PRICE_SPIKE_THRESHOLD_C: ${TELEGRAM_PRICE_SPIKE_C:-20}
      ALERT_DEDUPE_MIN: ${TELEGRAM_ALERT_DEDUPE_MIN:-30}
      SCHEDULER_TZ: ${SCHEDULER_TZ:-America/Chicago}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}

  webdashboard-api:
    build: ./webdashboard-api
    container_name: webdashboard-api
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_INIT_BUCKET}
      API_PORT: "8082"
      CACHE_TTL_S: "5"

  webdashboard:
    image: nginx:alpine
    container_name: webdashboard
    restart: unless-stopped
    depends_on:
      - webdashboard-api
    ports:
      - "8081:80"
    volumes:
      - ./webdashboard:/usr/share/nginx/html:ro
      - ./webdashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q 'ready'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  promtail:
    image: grafana/promtail:3.3.2
    container_name: promtail
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/tmp
    command: -config.file=/etc/promtail/config.yml

volumes:
  influxdb_data:
  influxdb_config:
  grafana_data:
  hvac_scheduler_data:
  loki_data:
  promtail_positions:
