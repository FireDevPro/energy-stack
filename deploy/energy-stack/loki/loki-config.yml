# Minimal single-node Loki config for energy-stack log aggregation.
# 7-day retention -- enough to debug recent issues, doesn't fill the SD card.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h         # 7 days -- bump if storage allows
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  # 20000 = 4x headroom over observed 7d decision_trace volume (~14.5k,
  # single-day peak ~4.3k). Loki default is 5000, which silently truncated
  # the 7d count and threatens d-2 by mid-summer. Loki memory at bump
  # time: 142 MiB / 15.6 GiB.
  max_entries_limit_per_query: 20000

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 50
  delete_request_store: filesystem
