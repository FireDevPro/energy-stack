# Telegraf for the ComfortNet HVAC pipeline.
# Design: docs/COMFORTNET_PIPELINE.md
#
# Two-block consumer pattern: continuous-state topics route to the `energy`
# bucket (downsampled to longterm by the influx-init Flux task); event topics
# route directly to `energy-longterm` and bypass aggregation.

[agent]
  interval = "10s"
  flush_interval = "10s"
  metric_buffer_limit = 10000
  omit_hostname = true

# ---- Continuous state: home/utility-room/hvac/comfortnet/<field> ----
# Publisher's payload uses the field name as the JSON key
# (e.g. {"heat_actual_pct": 35.0, "ts": "..."}), so Telegraf names the
# point field after the metric directly. We don't need the topic as a
# tag — the field name carries the same information without bloating
# tag cardinality. name_override forces the measurement to match the
# design doc's hvac.comfortnet schema regardless of plugin defaults.

[[inputs.mqtt_consumer]]
  servers = ["ssl://mosquitto:8883"]
  topics = ["home/+/hvac/comfortnet/+"]
  qos = 1
  client_id = "telegraf-energy-stack-continuous"
  persistent_session = true
  username = "telegraf"
  password = "${MOSQUITTO_TELEGRAF_PASSWORD}"
  tls_ca = "/etc/telegraf/certs/ca.crt"
  insecure_skip_verify = false
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "2006-01-02T15:04:05Z07:00"
  max_undelivered_messages = 1000
  topic_tag = ""
  name_override = "hvac.comfortnet"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "home/+/hvac/comfortnet/+"
    tags = "_/location/_/_/_"
  [inputs.mqtt_consumer.tags]
    bucket_route = "energy"

# ---- Events: home/utility-room/hvac/comfortnet/events/<type> ----
# Event payloads carry a typed body (e.g. fault carries critical_fault and
# minor_fault as separate JSON keys). Telegraf parses each as a point field
# on the hvac.comfortnet.events measurement, with the event_type derived
# from the topic's last segment via topic_parsing.

[[inputs.mqtt_consumer]]
  servers = ["ssl://mosquitto:8883"]
  topics = ["home/+/hvac/comfortnet/events/+"]
  qos = 1
  client_id = "telegraf-energy-stack-events"
  persistent_session = true
  username = "telegraf"
  password = "${MOSQUITTO_TELEGRAF_PASSWORD}"
  tls_ca = "/etc/telegraf/certs/ca.crt"
  insecure_skip_verify = false
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "2006-01-02T15:04:05Z07:00"
  max_undelivered_messages = 1000
  topic_tag = ""
  name_override = "hvac.comfortnet.events"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "home/+/hvac/comfortnet/events/+"
    tags = "_/location/_/_/_/event_type"
  [inputs.mqtt_consumer.tags]
    bucket_route = "energy-longterm"

# ---- Output: energy bucket (continuous, downsampled by Flux task) ----

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_INIT_ADMIN_TOKEN}"
  organization = "${INFLUXDB_INIT_ORG}"
  bucket = "energy"
  [outputs.influxdb_v2.tagpass]
    bucket_route = ["energy"]
  tagexclude = ["bucket_route"]

# ---- Output: energy-longterm bucket (events, never aggregated) ----

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_INIT_ADMIN_TOKEN}"
  organization = "${INFLUXDB_INIT_ORG}"
  bucket = "energy-longterm"
  [outputs.influxdb_v2.tagpass]
    bucket_route = ["energy-longterm"]
  tagexclude = ["bucket_route"]
