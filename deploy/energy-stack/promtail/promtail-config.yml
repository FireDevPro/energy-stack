# Promtail config: scrape Docker container logs and ship to Loki.
# Only labels containers from the energy-stack compose project to avoid
# pulling in chris-brain / pihole / etc. (those have their own log paths).
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        filters:
          - name: label
            values: ["com.docker.compose.project=energy-stack"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
    pipeline_stages:
      # If the line is JSON (our Python services emit JSON-line logs), parse it
      # and lift level + msg as labels for easier filtering.
      - json:
          expressions:
            level: level
            msg: msg
      - labels:
          level:
